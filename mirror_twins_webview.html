<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mirror Twins – Level 1</title>
<meta name="description" content="Drag one finger and two twins move as mirror images. Collect every star with either twin and keep both safe. 60 levels plus Mirror Rush.">
<meta name="theme-color" content="#f3ead8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="Mirror Twins">
<meta property="og:description" content="One finger. Two twins. Everything you do happens twice.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f3ead8'/%3E%3Cpath d='M50 12v76' stroke='%231c1b2e' stroke-width='3' stroke-dasharray='6 6'/%3E%3Ccircle cx='30' cy='50' r='15' fill='%2314b8a6' stroke='%231c1b2e' stroke-width='5'/%3E%3Ccircle cx='70' cy='50' r='15' fill='%23ff6b57' stroke='%231c1b2e' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#f3ead8; --ink:#1c1b2e; --teal:#14b8a6; --coral:#ff6b57; --gold:#ffb21e; --mut:rgba(28,27,46,.66); --line:rgba(28,27,46,.16); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;overflow:hidden;background:#d9ceb8;color:var(--ink);overscroll-behavior:none;
    font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:500;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;
  }
  button{font:inherit;font-weight:700;color:inherit}

  /* The whole game lives in a fixed 400x760 box that is scaled to fit any screen */
  #stage{
    position:absolute;left:50%;top:50%;width:400px;height:760px;transform:translate(-50%,-50%);transform-origin:center center;
    background:var(--paper);overflow:hidden;box-shadow:0 0 0 1px rgba(28,27,46,.12),0 30px 80px rgba(60,40,10,.3);
  }
  canvas#cv{position:absolute;left:0;top:0;width:400px;height:760px;display:block;touch-action:none;cursor:crosshair}

  /* ---------- buttons ---------- */
  .btn{
    font-size:16px;border:3px solid var(--ink);cursor:pointer;border-radius:999px;padding:12px 26px;color:var(--ink);background:var(--gold);
    box-shadow:0 4px 0 var(--ink);transition:transform .1s ease,box-shadow .1s ease;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .btn.teal{background:var(--teal);color:#fff}
  .btn.coral{background:var(--coral);color:#fff}
  .btn.ghost{background:#fff9ec;box-shadow:0 4px 0 rgba(28,27,46,.5);border-color:rgba(28,27,46,.5)}
  .btn.big{font-size:22px;padding:16px 56px}
  .btn.small{font-size:13px;padding:8px 16px;border-width:2px;box-shadow:0 3px 0 rgba(28,27,46,.5)}
  .btn small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:2px}
  .btn:focus-visible,.icoBtn:focus-visible,.lv:focus-visible,.skin:focus-visible{outline:3px solid #1c1b2e;outline-offset:3px}
  .icoBtn{
    width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);background:#fff9ec;box-shadow:0 3px 0 var(--ink);
    display:grid;place-items:center;cursor:pointer;padding:0;position:absolute;top:20px;
  }
  .icoBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .icoBtn svg{width:19px;height:19px}
  .icoBtn[hidden]{display:none}
  .icoBtn .badge{
    position:absolute;right:-6px;top:-7px;min-width:19px;height:19px;border-radius:10px;background:var(--coral);color:#fff;
    border:2px solid var(--ink);font-size:10px;display:grid;place-items:center;padding:0 3px;
  }

  /* ---------- HUD ---------- */
  #hud{position:absolute;left:0;top:0;width:100%;height:110px;pointer-events:none}
  #hud[hidden]{display:none}
  #lvl{position:absolute;left:18px;top:14px}
  #lvl b{display:block;font-size:23px;line-height:1.1}
  #lvl span{font-size:12px;color:var(--mut)}
  #hearts{margin-top:5px;font-size:16px;letter-spacing:3px}
  #hearts .lost{opacity:.2;filter:grayscale(1)}
  #hearts.hurt{animation:hurt .4s}
  @keyframes hurt{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  #goal{position:absolute;left:150px;top:18px;text-align:center;min-width:70px}
  #goal small{display:block;font-size:10px;letter-spacing:1px;color:var(--mut);height:12px}
  #goal b{display:block;font-size:26px;line-height:1.1}
  #goal b i{font-style:normal;color:var(--gold);text-shadow:0 0 0 var(--ink);-webkit-text-stroke:1.2px var(--ink)}
  #modeChip{position:absolute;left:0;right:0;top:82px;text-align:center;font-size:12px;color:var(--mut)}
  #modeChip b{color:var(--ink)}
  #hintBtn{left:238px;pointer-events:auto}
  #restartBtn{left:288px;pointer-events:auto}
  #pauseBtn{left:338px;pointer-events:auto}

  #toast{
    position:absolute;left:50%;top:128px;transform:translate(-50%,0);padding:9px 18px;border-radius:999px;max-width:364px;
    background:var(--ink);color:#fff9ec;font-size:13px;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:8;
  }
  #toast.show{opacity:1;transform:translate(-50%,-6px)}

  /* ---------- screens ---------- */
  .screen{
    position:absolute;inset:0;display:flex;justify-content:center;z-index:5;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility 0s linear .3s;
  }
  .screen.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .3s ease}
  .screen.solid{background:var(--paper)}
  .screen.center{align-items:center;padding:20px;background:rgba(243,234,216,.8)}
  .panel{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding:22px}
  .logo svg{width:190px;height:96px;display:block;margin:0 auto}
  .logo h1{margin:6px 0 4px;font-size:46px;line-height:1;letter-spacing:-.5px}
  .logo p{margin:0;color:var(--mut);font-size:15px}
  .statline{font-size:14px;color:var(--mut);line-height:1.7}
  .statline b{color:var(--ink)}
  .row{display:flex;gap:10px}
  .col{display:flex;flex-direction:column;gap:12px;align-items:center}
  .skins{display:flex;gap:10px}
  .skin{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0;display:grid;place-items:center;font-size:13px;background:#fff9ec;overflow:hidden}
  .skin i{display:block;width:50%;height:100%;float:left}
  .skin.sel{border-color:var(--ink)}
  .skin.lock{filter:grayscale(1) opacity(.5)}
  .skinNote{font-size:12px;color:var(--mut);margin-top:-8px}

  .card{
    width:min(344px,100%);padding:24px 24px 22px;border-radius:26px;text-align:center;background:#fff9ec;
    border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink);
    transform:translateY(14px) scale(.97);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);
  }
  .screen.show .card{transform:none}
  .card .emoji{font-size:42px;line-height:1;margin-bottom:8px}
  .card h1{margin:0 0 6px;font-size:26px}
  .card p{margin:0 0 14px;font-size:14px;line-height:1.5;color:var(--mut)}
  .card .big{display:block;font-size:44px;line-height:1.1}
  .card .sub{font-size:14px;color:var(--mut);margin:4px 0 12px;min-height:20px}
  .card .btns{display:flex;flex-direction:column;gap:12px;margin-top:8px}
  .card .btns .btn{width:100%}
  .stars{font-size:38px;letter-spacing:6px;color:rgba(28,27,46,.18);margin:2px 0 10px}
  .stars b{color:var(--gold);font-weight:400;-webkit-text-stroke:1.5px var(--ink);display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
  .stars b:nth-child(2){animation-delay:.15s}.stars b:nth-child(3){animation-delay:.3s}
  @keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
  .gain{margin:0 0 12px;padding:9px 12px;border-radius:14px;background:rgba(20,184,166,.14);border:2px solid rgba(20,184,166,.6);font-size:13px}
  .gain[hidden]{display:none}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
  .stats div{padding:10px 4px;border-radius:14px;background:rgba(28,27,46,.06);font-size:11px;color:var(--mut)}
  .stats b{display:block;font-size:19px;color:var(--ink);margin-bottom:2px}
  .stats[hidden]{display:none}
  .how{display:flex;flex-direction:column;gap:9px;text-align:left;margin:2px 0 14px;font-size:13px;line-height:1.4;color:var(--mut)}
  .how div{display:flex;gap:12px;align-items:center}
  .how i{font-style:normal;font-size:22px;width:30px;text-align:center;flex:none}
  .how b{color:var(--ink)}

  /* ---------- levels ---------- */
  .roadPanel{width:100%;height:100%;display:flex;flex-direction:column;padding:18px 16px}
  .roadPanel header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .roadPanel header h2{margin:0;font-size:22px;flex:1}
  .roadPanel header .stat{font-size:14px;font-weight:700}
  .roadPanel .icoBtn{position:static}
  #roadList{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0 -6px;padding:0 6px 16px;scrollbar-width:none;touch-action:pan-y;overscroll-behavior:contain}
  #roadList::-webkit-scrollbar{display:none}
  #roadList h3{margin:18px 2px 10px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
  #roadList h3 span{font-size:12px;color:var(--mut);font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
  .lv{
    height:62px;border-radius:16px;border:2.5px solid var(--ink);background:#fff9ec;cursor:pointer;box-shadow:0 3px 0 var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;font-size:18px;
  }
  .lv small{font-size:10px;letter-spacing:1px;color:var(--gold);-webkit-text-stroke:.6px var(--ink);height:12px}
  .lv.done{background:#d9f5ee}
  .lv.cur{background:var(--gold);animation:ring 1.6s ease-out infinite}
  .lv.lock{opacity:.4;cursor:default;box-shadow:none}
  .lv.shake{animation:shk .35s}
  @keyframes ring{0%{box-shadow:0 3px 0 var(--ink),0 0 0 0 rgba(255,178,30,.7)}100%{box-shadow:0 3px 0 var(--ink),0 0 0 12px rgba(255,178,30,0)}}
  @keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  @media (prefers-reduced-motion:reduce){ .screen,.card,#toast{transition:none} .lv.cur{animation:none} }

  /* ---------- Level-1 finger tutorial ---------- */
  #fingerTutor{
    position:absolute; left:0; top:0; width:100%; height:100%;
    pointer-events:none; z-index:12; opacity:0; transition:opacity .4s ease;
  }
  #fingerTutor.show{ opacity:1; }
  #fingerTutor .hand{
    position:absolute; width:56px; height:56px;
    filter: drop-shadow(0 4px 8px rgba(28,27,46,.35));
    transform-origin: 28px 48px;
  }
  #fingerTutor .hand svg{ width:100%; height:100%; display:block; }
  #fingerTutor .ripple{
    position:absolute; width:40px; height:40px; border-radius:50%;
    border:3px solid var(--teal); opacity:0;
    transform:translate(-50%,-50%) scale(.4);
  }
  #fingerTutor .label{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:118px; padding:10px 18px; border-radius:999px;
    background:var(--ink); color:#fff9ec; font-size:14px; font-weight:700;
    white-space:nowrap; box-shadow:0 4px 0 rgba(28,27,46,.4);
  }
  #fingerTutor .label small{ display:block; font-size:11px; font-weight:500; opacity:.75; margin-top:2px; text-align:center; }
  @keyframes fingerDrag{
    0%   { transform: translate(0,0) scale(1); }
    15%  { transform: translate(0,0) scale(.92); }
    40%  { transform: translate(70px,-90px) scale(1); }
    70%  { transform: translate(70px,-90px) scale(1); }
    85%  { transform: translate(0,0) scale(1); }
    100% { transform: translate(0,0) scale(1); }
  }
  @keyframes ripplePulse{
    0%   { opacity:0; transform:translate(-50%,-50%) scale(.3); }
    20%  { opacity:.7; }
    60%  { opacity:0; transform:translate(-50%,-50%) scale(1.6); }
    100% { opacity:0; }
  }
  @media (prefers-reduced-motion:reduce){
    #fingerTutor .hand{ animation:none !important; }
    #fingerTutor .ripple{ animation:none !important; }
  }


  /* WebView promo: hide chrome buttons */
  #hintBtn, #restartBtn, #pauseBtn { display:none !important; }

</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div id="lvl"><b id="lvNum">Level 1</b><span id="lvZone">Still Pond</span><div id="hearts" aria-label="Lives"></div></div>
    <div id="goal"><small id="goalLab">STARS</small><b id="goalVal"><i>★</i> 0/3</b></div>
    <button class="icoBtn" id="hintBtn" aria-label="Show route hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1c1b2e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
      <span class="badge" id="hintCnt">3</span>
    </button>
    <button class="icoBtn" id="restartBtn" aria-label="Restart">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1c1b2e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4.5h4.5"/></svg>
    </button>
    <button class="icoBtn" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="#1c1b2e"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
    </button>
    <div id="modeChip">Mirror: <b id="modeName">Left ⇄ Right</b></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Level-1 finger tutorial -->
  <div id="fingerTutor" aria-hidden="true">
    <div class="ripple" id="fingerRipple"></div>
    <div class="hand" id="fingerHand">
      <svg viewBox="0 0 14 14" fill="#1c1b2e" xmlns="http://www.w3.org/2000/svg">
        <path d="m 6.828077,12.956595 c -0.024,-0.024 -0.0442,-0.1342 -0.045,-0.245 -8.7e-4,-0.1109 -0.0558,-0.3213 -0.12234,-0.4677 -0.11774,-0.2593 -0.23929,-0.3956 -1.01355,-1.137 -0.31934,-0.3057 -0.45892,-0.5276 -0.96449,-1.5331003 -0.66651,-1.3256 -0.86062,-1.6451 -1.38537,-2.2809 -0.50514,-0.612 -0.48358,-0.8601 0.0897,-1.0319 0.21664,-0.065 0.30464,-0.058 0.56821,0.042 0.36871,0.1409 0.88947,0.64 1.15739,1.1093 0.10258,0.1798 0.24648,0.393 0.31977,0.4738 0.15427,0.1703 0.40525,0.194 0.46291,0.044 0.0218,-0.057 0.0397,-1.2887 0.0397,-2.7375 0,-3.0305 -0.0245,-2.9018 0.56401,-2.9583 0.28104,-0.027 0.3539,-0.01 0.51866,0.1336 l 0.19169,0.165 0,1.3138 c 0,0.8913 0.021,1.2853 0.0653,1.2252 0.1798,-0.2437 0.56663,-0.3058 0.88356,-0.1419 0.24465,0.1265 0.32494,0.2815 0.32752,0.6322 0.002,0.2453 0.0131,0.2675 0.087,0.1702 0.34959,-0.4601 1.21794,-0.1378 1.21794,0.4521 l 0,0.2247 0.17219,-0.1354 c 0.20285,-0.1596 0.34062,-0.1687 0.64246,-0.043 0.39653,0.1656 0.41372,0.2586 0.43697,2.3647 l 0.021,1.8972003 -0.31394,0.6043 c -0.34743,0.6688 -0.47253,1.03 -0.53788,1.553 l -0.0437,0.3498 -1.64805,0 c -0.90642,0 -1.66765,-0.02 -1.69161,-0.044 z M 5.352857,4.2090947 c -0.40669,-0.3673 -0.59297,-0.798 -0.59297,-1.3711 0,-1.90329998 2.48567,-2.54399998 3.423,-0.8822 0.1804,0.3198 0.2026,0.417 0.20148,0.8822 -10e-4,0.4396 -0.0293,0.5764 -0.17747,0.8593 -0.15717,0.3002 -0.58491,0.7418 -0.71841,0.7418 -0.12881,0 -0.0302,-0.3215 0.15158,-0.4942 0.47843,-0.4545 0.62257,-1.2102 0.33661,-1.7648 -0.17477,-0.339 -0.58257,-0.7083 -0.89647,-0.812 -0.64868,-0.214 -1.45861,0.082 -1.81904,0.665 -0.37581,0.6079 -0.29624,1.3221 0.21172,1.9007 0.1344,0.1531 0.20267,0.2929 0.18914,0.3875 -0.0202,0.1407 -0.0351,0.1353 -0.30917,-0.1122 z m 0.13499,-0.8742 c -0.60215,-1.3882 1.38278,-2.39849998 2.12783,-1.083 0.1774,0.3132 0.19599,0.7944 0.0431,1.1166 -0.18714,0.3943 -0.2447,0.3458 -0.20146,-0.17 0.047,-0.5607 -0.0312,-0.8043 -0.3422,-1.066 -0.37415,-0.3148 -1.08308,-0.1925 -1.32307,0.2283 -0.04     </div>
    <div class="label">Drag to move<small>Your twin mirrors you</small></div>
  </div>

</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ------------------------------------------------------------------ */
/*  Core: rules + simulation (no DOM access in this block)              */
/* ------------------------------------------------------------------ */
/*CORE_START*/
const W = 400, H = 760, AL = 10, AR = 390, AT = 112, AB = 742, CY = 427;       // arena bounds, mirror axis (CY) for up/down
const TW_R = 11, VMAX = 260, HEARTS = 3;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }
// Each mode is the list of reflections applied to the twin you steer (id = yourself)
const MODES = { h:['id', 'h'], v:['id', 'v'], p:['id', 'p'], q:['id', 'h', 'v', 'p'] };
const MODE_NAMES = { h:'Left \u21C4 Right', v:'Up \u21C5 Down', p:'Point mirror', q:'Four-way' };
function tf(k, x, y){ return k === 'id' ? [x, y] : k === 'h' ? [W - x, y] : k === 'v' ? [x, 2*CY - y] : [W - x, 2*CY - y]; }
function images(m, x, y){ return MODES[m].map(k => tf(k, x, y)); }
const WORLDS = ['Still Pond', 'Upside Down', 'Turnabout', 'Sawmill', 'Orbit', 'Kaleidoscope'];
const SEQ = ['h', 'v', 'p', 'h', 'p', 'q'];                        // mirror shifts in Mirror Rush

// lv = { m, s:[x,y], st:[[x,y]], sp:[[x,y,r,(born,life)]], sw:[[x1,y1,x2,y2,speed,phase,r,(born,life)]], ob:[[cx,cy,R,speed,phase,r,(born,life)]], mn:[[x,y,r,period,phase,(born,life)]], wl:[[x,y,w,h]], h:[route] }
function hazardsAt(lv, t){
  const out = [], live = (b, l) => b == null || (t >= b && t <= b + l), warm = b => b == null ? 1 : clamp((t - b)/1.0, 0, 1);
  for (const s of lv.sp) if (live(s[3], s[4])){ const w = warm(s[3]); out.push({ x:s[0], y:s[1], r:s[2], k:'sp', on:w >= 1, w }); }
  for (const s of lv.sw) if (live(s[7], s[8])){ const f = .5 + .5*Math.sin(t*s[4] + s[5]), w = warm(s[7]); out.push({ x:s[0] + (s[2] - s[0])*f, y:s[1] + (s[3] - s[1])*f, r:s[6], k:'sw', on:w >= 1, w }); }
  for (const s of lv.ob) if (live(s[6], s[7])){ const a = t*s[3] + s[4], w = warm(s[6]); out.push({ x:s[0] + Math.cos(a)*s[2], y:s[1] + Math.sin(a)*s[2], r:s[5], k:'ob', cx:s[0], cy:s[1], on:w >= 1, w }); }
  for (const s of lv.mn) if (live(s[5], s[6])){ const armed = ((t + s[4]) % s[3]) < s[3]*.55, w = warm(s[5]); out.push({ x:s[0], y:s[1], r:s[2], k:'mn', armed, on:armed && w >= 1, w }); }
  return out;
}
function newRun(lv){
  return { lv, m:lv.m, t:0, a:{ x:lv.s[0], y:lv.s[1], vx:0, vy:0 }, lives:HEARTS, inv:0, dead:0, got:lv.st.map(() => 0), gotN:0, hits:0,
           fin:{ on:false, x:0, y:0 }, ev:[], won:false, lost:false, rush:null };
}
function freeAt(r, x, y){
  for (const k of MODES[r.m]){
    const p = tf(k, x, y);
    if (p[0] < AL + TW_R || p[0] > AR - TW_R || p[1] < AT + TW_R || p[1] > AB - TW_R) return false;
    for (const w of r.lv.wl){ const cx = clamp(p[0], w[0], w[0] + w[2]), cy = clamp(p[1], w[1], w[1] + w[3]); if (Math.hypot(p[0] - cx, p[1] - cy) < TW_R) return false; }
  }
  return true;
}
function stepRun(r, h){
  if (r.won || r.lost) return;
  r.t += h; const lv = r.lv, a = r.a;
  if (r.inv > 0) r.inv -= h;
  if (r.dead > 0){
    r.dead -= h;
    if (r.dead <= 0){ a.x = lv.s[0]; a.y = lv.s[1]; a.vx = a.vy = 0; r.inv = 1.6; r.ev.push({ type:'respawn' }); }
    if (r.rush) rushTick(r, h);
    return;
  }
  // steer the main twin toward the finger; every other twin is a reflection of it
  if (r.fin.on){
    const dx = r.fin.x - a.x, dy = r.fin.y - a.y, d = Math.hypot(dx, dy), sp = Math.min(VMAX, d*8), k = Math.min(1, h*16);
    a.vx += ((d > .5 ? dx/d*sp : 0) - a.vx)*k; a.vy += ((d > .5 ? dy/d*sp : 0) - a.vy)*k;
  } else { a.vx *= .8; a.vy *= .8; }
  const nx = a.x + a.vx*h, ny = a.y + a.vy*h;
  if (freeAt(r, nx, ny)){ a.x = nx; a.y = ny; }
  else if (freeAt(r, nx, a.y)){ a.x = nx; a.vy = 0; }
  else if (freeAt(r, a.x, ny)){ a.y = ny; a.vx = 0; }
  else { a.vx = a.vy = 0; }
  const ims = images(r.m, a.x, a.y);
  // hazards
  if (r.inv <= 0){
    outer: for (const z of hazardsAt(lv, r.t)){
      if (!z.on) continue;
      for (const p of ims) if (Math.hypot(p[0] - z.x, p[1] - z.y) < z.r + TW_R - 3){
        r.lives--; r.hits++; r.inv = 1.8; r.dead = .7; a.vx = a.vy = 0; r.ev.push({ type:'hit', ims, x:p[0], y:p[1] });
        if (r.lives <= 0){ r.lost = true; r.ev.push({ type:'lost' }); }
        break outer;
      }
    }
  }
  if (r.lost) return;
  // stars: any twin can collect any star
  for (let i = 0; i < lv.st.length; i++){
    if (r.got[i]) continue;
    for (const p of ims) if (Math.hypot(p[0] - lv.st[i][0], p[1] - lv.st[i][1]) < 18){
      r.got[i] = 1; r.gotN++; r.ev.push({ type:'star', x:lv.st[i][0], y:lv.st[i][1], i });
      if (r.rush) rushStar(r);
      break;
    }
  }
  if (r.rush) rushTick(r, h);
  else if (r.gotN >= lv.st.length){ r.won = true; r.ev.push({ type:'win' }); }
}

// ---- Mirror Rush: endless, one star at a time, hazards keep arriving, the mirror shifts every 8 stars ----
function newRush(seed){
  const lv = { m:SEQ[0], s:[200, 680], st:[], sp:[], sw:[], ob:[], mn:[], wl:[], h:[] };
  const r = newRun(lv);
  r.rush = { seed, rS:mulberry(seed), rH:mulberry((seed ^ 0x9e3779b9) >>> 0), nextHaz:4, stars:0, score:0, combo:1, lastGain:-9, modeIdx:0, shiftAt:0, nextM:SEQ[0], starT:0, life:12, missed:0 };
  nextStar(r); return r;
}
function nextStar(r){
  const R = r.rush, lv = r.lv; let x = 0, y = 0;
  for (let i = 0; i < 12; i++){
    x = 30 + R.rS()*340; y = AT + 30 + R.rS()*(AB - AT - 60);
    let ok = true; for (const p of images(r.m, r.a.x, r.a.y)) if (Math.hypot(p[0] - x, p[1] - y) < 70) ok = false;
    if (ok) break;
  }
  lv.st = [[x, y]]; r.got = [0]; r.gotN = 0; R.starT = r.t; R.life = Math.max(6, 12 - R.stars*.05);
}
function rushStar(r){
  const R = r.rush; R.stars++;
  R.combo = (r.t - R.lastGain <= 3.5) ? Math.min(5, R.combo + 1) : 1; R.lastGain = r.t;
  const pts = 10*R.combo; R.score += pts; r.ev.push({ type:'pts', pts, combo:R.combo, x:r.lv.st[0][0], y:r.lv.st[0][1] });
  if (R.stars % 8 === 0 && !R.shiftAt){ R.modeIdx++; R.nextM = SEQ[R.modeIdx % SEQ.length]; R.shiftAt = r.t + 1.8; r.ev.push({ type:'shiftWarn', m:R.nextM }); }
  nextStar(r);
}
function rushTick(r, h){
  const R = r.rush, lv = r.lv, t = r.t;
  if (R.combo > 1 && t - R.lastGain > 3.5) R.combo = 1;
  if (t - R.starT > R.life){                                   // a star that fades costs a heart, so you cannot sit still
    r.lives--; R.missed++; R.combo = 1; r.ev.push({ type:'starLost', x:lv.st[0][0], y:lv.st[0][1] });
    if (r.lives <= 0){ r.lost = true; r.ev.push({ type:'lost' }); return; }
    nextStar(r);
  }
  if (R.shiftAt && t >= R.shiftAt){ r.m = R.nextM; R.shiftAt = 0; r.inv = Math.max(r.inv, 1.4); r.ev.push({ type:'shift', m:r.m }); }
  const gone = (b, l) => b != null && t > b + l + 1;
  lv.sp = lv.sp.filter(s => !gone(s[3], s[4])); lv.sw = lv.sw.filter(s => !gone(s[7], s[8])); lv.ob = lv.ob.filter(s => !gone(s[6], s[7])); lv.mn = lv.mn.filter(s => !gone(s[5], s[6]));
  const count = lv.sp.length + lv.sw.length + lv.ob.length + lv.mn.length, cap = Math.min(16, 7 + Math.floor(t/14));
  if (t >= R.nextHaz){ R.nextHaz = t + Math.max(1.8, 4.5 - t*.02); if (count < cap) spawnHazard(r); }
}
function spawnHazard(r){
  const R = r.rush, lv = r.lv, t = r.t, rnd = R.rH;
  const kinds = ['sp']; if (t > 20) kinds.push('sw', 'sw'); if (t > 40) kinds.push('ob'); if (t > 60) kinds.push('mn');
  const kind = kinds[Math.floor(rnd()*kinds.length)];
  const ims = images(r.m, r.a.x, r.a.y); let x = 0, y = 0, ok = false;
  for (let i = 0; i < 24 && !ok; i++){
    x = 40 + rnd()*320; y = AT + 40 + rnd()*(AB - AT - 80); ok = true;
    for (const p of ims) if (Math.hypot(p[0] - x, p[1] - y) < 110) ok = false;
    for (const p of images(r.m, lv.st[0][0], lv.st[0][1])) if (Math.hypot(p[0] - x, p[1] - y) < 60) ok = false;
  }
  if (!ok) return;
  if (kind === 'sp') lv.sp.push([x, y, 14 + Math.floor(rnd()*7), t, 38]);
  else if (kind === 'sw'){ const an = rnd()*6.283, hl = 50 + rnd()*40; lv.sw.push([x - Math.cos(an)*hl, y - Math.sin(an)*hl, x + Math.cos(an)*hl, y + Math.sin(an)*hl, .8 + rnd()*.8, rnd()*6.283, 15, t, 40]); }

  else lv.mn.push([x, y, 18, 1.8 + rnd()*.8, rnd()*6.283, t, 36]);

}

/* ---- Level-1 finger tutorial ---- */
let fingerShown = false, fingerHideT = 0;
function showFingerTutor(){
  if (fingerShown) return;
  fingerShown = true;
  const el = $('fingerTutor'), hand = $('fingerHand'), ripple = $('fingerRipple');
  if (!el || !r) return;
  // Position near the starting twin (bottom-leftish)
  const sx = r.a.x, sy = r.a.y;
  hand.style.left = (sx - 8) + 'px';
  hand.style.top  = (sy - 8) + 'px';
  ripple.style.left = sx + 'px';
  ripple.style.top  = sy + 'px';
  el.classList.add('show');
  // Animate the drag loop
  hand.style.animation = 'fingerDrag 2.4s ease-in-out infinite';
  ripple.style.animation = 'ripplePulse 2.4s ease-out infinite';
  // Auto-hide after ~7s or on first real input
  clearTimeout(fingerHideT);
  fingerHideT = setTimeout(hideFingerTutor, 7200);
}
function hideFingerTutor(){
  const el = $('fingerTutor');
  if (!el) return;
  el.classList.remove('show');
  clearTimeout(fingerHideT);
  const hand = $('fingerHand'), ripple = $('fingerRipple');
  if (hand) hand.style.animation = '';
  if (ripple) ripple.style.animation = '';
}

  else { $('lvNum').textContent = m === 'daily' ? 'Daily Rush' : 'Mirror Rush'; $('lvZone').textContent = m === 'daily' ? dateKey() : 'Endless'; $('hintBtn').hidden = true; }
  syncHearts(); syncHints(); syncGoal();
  $('hud').hidden = false; hideScreens(); state = 'play';
  if (m === 'campaign'){
    // Show finger showcase on the promo starting level
    if (curLevel === 26) setTimeout(showFingerTutor, 500);
    else hideFingerTutor();
  } else {
    hideFingerTutor();
  }
}
function leavePlay(){ $('toast').classList.remove('show'); inp.on = false; off = null; }
function go(name){
  // WebView version – no screens, just restart current level
  startGame(mode, curLevel);
}
function pauseGame(){ if (state !== 'play') return; state = 'paused'; inp.on = false; off = null; toast('Paused – tap restart or keep playing', 2000); }
function resumeGame(){ if (state !== 'paused') return; state = 'play'; }

let lastRes = null;
function showResult(kind){
  // WebView version: no result screens – auto advance or restart
  const secs = Math.round(r.t);
  if (mode === 'campaign'){
    if (kind === 'win'){
      const n = r.lives >= 3 ? 3 : r.lives === 2 ? 2 : 1;
      const rec = Store.d.levels[curLevel] || { stars:0 };
      const was = rec.stars || 0;
      rec.stars = Math.max(was, n);
      Store.d.levels[curLevel] = rec;
      if (curLevel >= Store.d.unlocked && curLevel < LEVELS) Store.d.unlocked = curLevel + 1;
      if (n === 3 && was < 3) Store.d.hints = Math.min(9, Store.d.hints + 1);
      Store.save();
      Snd.win();
      Hap.buzz(60);
      toast(curLevel >= LEVELS ? '👑 All levels cleared!' : '⭐ Level ' + curLevel + ' cleared!', 1800);
      setTimeout(() => {
        if (curLevel < LEVELS) startGame('campaign', curLevel + 1);
        else startGame('campaign', 26); // loop back to level 1
      }, 1600);
    } else {
      Snd.lose();
      toast('💥 Out of hearts – try again', 1600);
      setTimeout(() => startGame('campaign', curLevel), 1400);
    }
  } else {
    const R = r.rush;
    if (mode === 'rush' && R.score > Store.d.bestRush) Store.d.bestRush = R.score;
    Store.save();
    Snd.lose();
    toast('Score: ' + nfmt(R.score), 2000);
    setTimeout(() => startGame(mode), 1800);
  }
  // stay in play state; next startGame will re-init
}
async function shareScore(){
  const txt = lastRes ? lastRes.text : 'Come play Mirror Twins 🪞';
  try {
    if (navigator.share) await navigator.share({ title:'Mirror Twins', text:txt, url:location.href });
    else { await navigator.clipboard.writeText(txt + ' ' + location.href); toast('Copied to clipboard'); }
  } catch(e){}
}

/* ---- effects + events ---- */
function burst(x, y, col, n, sp){
  for (let i = 0; i < n; i++){ const a = Math.random()*6.283, v = sp*(.3 + Math.random()); parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:0, max:.4 + Math.random()*.5, col, sz:1.8 + Math.random()*2.6 }); }
}
function popup(x, y, txt, col, size){ pops.push({ x:clamp(x, 34, W - 34), y, txt, col:col || INK, size:size || 15, life:0 }); }
function processEvents(){
  const cols = skinColors();
  for (const e of r.ev){
    if (e.type === 'star'){ burst(e.x, e.y, '#ffc83a', 14, 130); if (!r.rush) popup(e.x, e.y - 18, r.gotN + '/' + r.lv.st.length, INK, 15); Snd.star(e.i, r.rush ? r.rush.combo : 1); Hap.buzz(14); }
    else if (e.type === 'pts'){ popup(e.x, e.y - 18, '+' + e.pts + (e.combo > 1 ? '  x' + e.combo : ''), e.combo > 1 ? '#e0452f' : INK, e.combo > 1 ? 19 : 15); }
    else if (e.type === 'hit'){ e.ims.forEach((p, i) => burst(p[0], p[1], cols[i % 4], 14, 170)); flash = .35; shake = .3; syncHearts(true); Snd.hit(); Hap.buzz(90); popup(e.x, e.y - 22, '-1 ❤️', '#e0452f', 20); }
    else if (e.type === 'starLost'){ burst(e.x, e.y, '#8d8570', 12, 100); popup(e.x, e.y - 20, 'Faded! -1 ❤️', '#e0452f', 17); flash = .3; shake = .25; syncHearts(true); Snd.hit(); Hap.buzz(70); }
    else if (e.type === 'respawn'){ burst(r.a.x, r.a.y, cols[0], 8, 90); }
    else if (e.type === 'spawn'){ if (Math.random() < .5) Snd.spawn(); }
    else if (e.type === 'shiftWarn'){ shiftGhost = { m:e.m, t:0 }; toast('Mirror shift: ' + MODE_NAMES[e.m], 1700); Snd.shiftWarn(); }
    else if (e.type === 'shift'){ shiftGhost = null; flash = .22; burst(200, CY, '#7c5cff', 26, 260); Snd.shift(); Hap.buzz(40); }
    else if (e.type === 'win'){ endKind = 'win'; endT = 0; state = 'ending'; for (const p of images(r.m, r.a.x, r.a.y)) burst(p[0], p[1], '#ffc83a', 24, 220); }
    else if (e.type === 'lost'){ endKind = 'lose'; endT = 0; state = 'ending'; syncHearts(); }
  }
  r.ev.length = 0;
}

/* ---- input: drag anywhere; touch is relative so your finger never covers the twins ---- */
function toLogical(e){
  const rc = stage.getBoundingClientRect();
  return { x:(e.clientX - rc.left)/rc.width*W, y:(e.clientY - rc.top)/rc.height*H };
}
stage.addEventListener('pointerdown', e => {
  if (state !== 'play' || e.target.closest('button')) return;
  try { stage.setPointerCapture(e.pointerId); } catch(err){}
  const p = toLogical(e);
  if (e.pointerType === 'mouse'){ off = null; inp.x = p.x; inp.y = p.y; }
  else { off = { x:r.a.x - p.x, y:r.a.y - p.y }; inp.x = p.x + off.x; inp.y = p.y + off.y; }
  inp.on = true; r.fin = inp;
  hideFingerTutor(); // dismiss tutorial on first touch
});
stage.addEventListener('pointermove', e => {
  if (state !== 'play') return;
  const p = toLogical(e);
  if (e.pointerType === 'mouse'){ inp.on = true; inp.x = p.x; inp.y = p.y; r.fin = inp; }
  else if (off && inp.on){ inp.x = p.x + off.x; inp.y = p.y + off.y; }
});
function lift(){ off = null; if (r) { inp.on = false; r.fin = inp; } }
stage.addEventListener('pointerup', lift); stage.addEventListener('pointercancel', lift);
const keys = {};
window.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (state === 'paused') resumeGame(); else pauseGame(); return; } keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function applyKeys(){
  const dx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0), dy = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
  if (dx || dy){ const l = Math.hypot(dx, dy); inp.on = true; inp.x = r.a.x + dx/l*90; inp.y = r.a.y + dy/l*90; r.fin = inp; hideFingerTutor(); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

$('pauseBtn').addEventListener('click', pauseGame);
$('restartBtn').addEventListener('click', () => { if (state === 'play') startGame(mode, curLevel); });
// pause overlay buttons removed in WebView build
$('hintBtn').addEventListener('click', () => {
  if (state !== 'play' || mode !== 'campaign') return;
  if (hintT > 0){ hintT = 8; return; }
  if (Store.d.hints <= 0){ toast('No hints left. You get a free one every day', 2600); return; }
  Store.d.hints--; Store.save(); syncHints(); hintT = 8; Snd.hint();
});
// menu buttons removed – game auto-starts at Level 1
document.addEventListener('pointerdown', () => Snd.init(), { passive:true });
document.addEventListener('click', e => { if (e.target.closest('button')) Snd.click(); });

/* ---- toggles / home / levels ---- */
function syncToggles(){}
function updateHome(){}
function buildRoad(){}

/* ------------------------------------------------------------------ */
/*  Render                                                              */
/* ------------------------------------------------------------------ */
function drawAxis(m, ghost){
  ctx.save(); ctx.strokeStyle = ghost ? 'rgba(124,92,255,.7)' : 'rgba(28,27,46,.28)'; ctx.lineWidth = ghost ? 3 : 2.2; ctx.setLineDash([9, 9]); ctx.lineDashOffset = -tAnim*14;
  ctx.beginPath();
  if (m === 'h' || m === 'q' || m === 'p'){ ctx.moveTo(W/2, AT + 6); ctx.lineTo(W/2, AB - 6); }
  if (m === 'v' || m === 'q' || m === 'p'){ ctx.moveTo(AL + 6, CY); ctx.lineTo(AR - 6, CY); }
  ctx.stroke(); ctx.setLineDash([]);
  if (m === 'p' || m === 'q'){ ctx.fillStyle = ghost ? 'rgba(124,92,255,.8)' : 'rgba(28,27,46,.4)'; ctx.beginPath(); ctx.arc(W/2, CY, 5, 0, 6.2832); ctx.fill(); }
  ctx.restore();
}
function eyeDir(k, vx, vy){ return k === 'id' ? [vx, vy] : k === 'h' ? [-vx, vy] : k === 'v' ? [vx, -vy] : [-vx, -vy]; }

function render(){
  ctx.setTransform(Q, 0, 0, Q, 0, 0); ctx.clearRect(0, 0, W, H);
  if (bg) ctx.drawImage(bg, 0, 0, W, H);
  if (!r) return;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5)*10*shake/.3, (Math.random() - .5)*10*shake/.3);
  const lv = r.lv, a = r.a, cols = skinColors(), ks = MODES[r.m];

  drawAxis(r.m, false);
  if (shiftGhost){ drawAxis(shiftGhost.m, true); for (const p of images(shiftGhost.m, a.x, a.y)) { ctx.strokeStyle = 'rgba(124,92,255,.85)'; ctx.lineWidth = 3; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.arc(p[0], p[1], 15 + Math.sin(tAnim*10)*1.5, 0, 6.2832); ctx.stroke(); ctx.setLineDash([]); } }
  for (const w of lv.wl) drawWall(w);

  // hint route (every twin's version of it)
  if (hintT > 0 && lv.h && lv.h.length){
    const route = [lv.s].concat(lv.h); ctx.save(); ctx.globalAlpha = Math.min(1, hintT/1.2)*.8; ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.setLineDash([2, 9]); ctx.lineDashOffset = -tAnim*30;
    ks.forEach((k, ki) => { ctx.strokeStyle = cols[ki % 4]; ctx.beginPath(); route.forEach((p, i) => { const q = tf(k, p[0], p[1]); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); }); ctx.stroke(); });
    ctx.restore();
  }

  // stars
  lv.st.forEach((p, i) => { if (r.got[i] && !r.rush) drawStar(p[0], p[1], 10, tAnim*.5, true); else if (!r.got[i]){ drawStar(p[0], p[1] + Math.sin(tAnim*3 + i)*2, 12, Math.sin(tAnim*2 + i)*.15, false);
    if (r.rush){ const f = Math.max(0, 1 - (r.t - r.rush.starT)/r.rush.life); ctx.strokeStyle = f < .3 ? '#e0452f' : INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p[0], p[1], 20, -1.5708, -1.5708 + f*6.2832); ctx.stroke(); } } });

  // hazards
  for (const z of hazardsAt(lv, r.t)) drawHazard(z, tAnim);

  // trails + twins
  if (state !== 'ending' || endKind === 'win'){
    for (let i = 1; i < trail.length; i++){
      const q = trail[i], p0 = trail[i - 1], al = (i/trail.length)*.35;
      ks.forEach((k, ki) => { const A = tf(k, p0.x, p0.y), B = tf(k, q.x, q.y); ctx.strokeStyle = cols[ki % 4]; ctx.globalAlpha = al; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke(); });
    }
    ctx.globalAlpha = 1;
    // line between the pair
    if (ks.length === 2){ const P = tf(ks[1], a.x, a.y); ctx.strokeStyle = 'rgba(28,27,46,.12)'; ctx.lineWidth = 2; ctx.setLineDash([3, 6]); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(P[0], P[1]); ctx.stroke(); ctx.setLineDash([]); }
    const dead = r.dead > 0, al = dead ? 0 : (r.inv > 0 ? (Math.sin(tAnim*30) > 0 ? .45 : 1) : 1);
    if (!dead) ks.forEach((k, ki) => { const p = tf(k, a.x, a.y), e = eyeDir(k, a.vx, a.vy); drawTwin(p[0], p[1], cols[ki % 4], e[0], e[1], al, 1); });
  }

  for (const q of parts){ ctx.globalAlpha = Math.max(0, 1 - q.life/q.max); ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(q.x, q.y, q.sz, 0, 6.2832); ctx.fill(); }
  ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const q of pops){
    ctx.globalAlpha = Math.max(0, 1 - q.life/1.0); ctx.font = '700 ' + q.size + 'px Outfit, system-ui, sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = '#fff9ec'; ctx.strokeText(q.txt, q.x, q.y); ctx.fillStyle = q.col; ctx.fillText(q.txt, q.x, q.y);
  }
  ctx.globalAlpha = 1; ctx.restore();
  if (flash > 0){ ctx.fillStyle = 'rgba(255,90,70,' + (flash/.35*.22) + ')'; ctx.fillRect(0, 0, W, H); }
}

function updateFx(dt){
  tAnim += dt;
  for (const q of parts){ q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= .94; q.vy *= .94; q.life += dt; } parts = parts.filter(q => q.life < q.max);
  for (const q of pops){ q.y -= 30*dt; q.life += dt; } pops = pops.filter(q => q.life < 1);
  for (const q of trail) q.life -= dt*1.8; trail = trail.filter(q => q.life > 0);
  flash = Math.max(0, flash - dt); shake = Math.max(0, shake - dt); if (hintT > 0) hintT -= dt;
}

function frame(ts){
  const now = ts/1000, dt = Math.min(.05, Math.max(0, now - last)); last = now;
  if (r && (state === 'play' || state === 'ending')){
    if (state === 'play'){
      applyKeys(); acc += dt; let n = 0;
      while (acc >= 1/60 && n < 5 && state === 'play'){ stepRun(r, 1/60); acc -= 1/60; n++; if (r.ev.length) processEvents(); }
      if (n >= 5) acc = 0;
      if (r.dead <= 0 && (Math.abs(r.a.vx) + Math.abs(r.a.vy) > 20)){ trail.push({ x:r.a.x, y:r.a.y, life:1 }); if (trail.length > 28) trail.shift(); }
      syncGoal();
      if (shiftGhost) shiftGhost.t += dt;
    } else {
      endT += dt; if (r.rush || endKind === 'lose'){ stepRun(r, dt*.5); if (r.ev.length) processEvents(); }
      if (endT > (endKind === 'win' ? 1.1 : 1.0)) showResult(endKind);
    }
  }
  updateFx(dt); render();
  requestAnimationFrame(frame);
}

function layout(){
  s = Math.min(window.innerWidth/W, window.innerHeight/H, 1.6);
  dpr = Math.min(window.devicePixelRatio || 1, 3); Q = s*dpr;
  cv.width = Math.round(W*Q); cv.height = Math.round(H*Q);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  buildBg();
}
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 60); });
window.addEventListener('orientationchange', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });

/* ---- boot ---- */
Store.load();
Store.d.unlocked = Math.max(Store.d.unlocked || 1, 60); // ensure all levels open for promo
Store.d.seenHelp = true; // skip help
if (Store.d.skin >= SKINS.length || Store.stars() < SKINS[Store.d.skin].need) Store.d.skin = 0;
layout();
syncHints();
// Auto-start Level 1 for WebView embedding
startGame('campaign', 26);
if (document.fonts && document.fonts.load) document.fonts.load('700 20px Outfit').catch(() => {});
requestAnimationFrame(ts => { last = ts/1000; frame(ts); });

})();
</script>
